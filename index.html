<style>
:root{--accent:#0066CC;--ink:#1b2430;--mut:#5b6675;--line:#d5dbe3;--bg:#f4f6f9}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
.bar{flex:none;height:56px;display:flex;align-items:center;gap:16px;padding:0 20px;background:#fff;border-bottom:2px solid var(--line)}
.brand{font-weight:900;font-size:16px;letter-spacing:.5px;white-space:nowrap}
.brand b{color:var(--accent)}
.tabs{display:flex;gap:8px;margin-left:8px}
.tab{appearance:none;font:inherit;font-size:14px;font-weight:700;padding:8px 20px;border:2px solid var(--line);border-radius:999px;background:#fff;color:var(--mut);cursor:pointer;white-space:nowrap;transition:.15s}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab:focus-visible{outline:3px solid #99c2ee;outline-offset:2px}
.stage{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
iframe.on{display:block}
@media(max-width:520px){.bar{padding:0 12px;gap:8px}.brand{display:none}.tabs{margin-left:0}.tab{padding:8px 14px}}
#gate{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#gate[hidden]{display:none}
.gcard{width:100%;max-width:400px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:32px 24px;text-align:center}
.gcard h1{font-size:22px;font-weight:900;margin-bottom:8px}
.gcard h1 b{color:var(--accent)}
.gcard p{font-size:14px;color:var(--mut);line-height:1.6;margin-bottom:24px}
#gbtn{appearance:none;font:inherit;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:12px 24px;border:2px solid var(--accent);border-radius:999px;background:#fff;color:var(--accent);cursor:pointer;transition:.15s}
#gbtn:hover:not(:disabled){background:var(--accent);color:#fff}
#gbtn:focus-visible{outline:3px solid #99c2ee;outline-offset:2px}
#gbtn:disabled{opacity:.5;cursor:default}
#gbtn svg{width:20px;height:20px;flex:none}
.gcard .gtip{font-size:12px;color:var(--mut);margin-top:16px;line-height:1.6;margin-bottom:0}
#gmsg{font-size:14px;color:#b71c22;margin-top:16px;min-height:24px;line-height:1.6}
</style>
</head>

<script type="text/x-tpl" id="tpl-qa"><!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA 轉 HTML 工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F6F7F9;--card:#fff;--line:#E3E6EA;--line-strong:#CBD0D7;--hover:#F3F4F6;
  --ink:#1F2933;--ink-2:#4B5563;--mute:#6B7280;--faint:#9AA3AE;
  --accent:#0066CC;--accent-h:#0A57AE;--accent-ink:#0C447C;--accent-line:#B5D4F4;--accent-soft:#F5F9FF;
  --ok:#2E7D32;--warn:#B45309;--warn-line:#F5D9A8;--warn-soft:#FFFAF0;
  --shadow:0 2px 4px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;letter-spacing:.02em;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea,summary{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
svg{display:block}

/* 頁首 */
header{background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:20}
.hd{max-width:1760px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap}
.brandwrap{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.brand b{display:block;font-size:22px;font-weight:700;line-height:1.35;letter-spacing:.08em;white-space:nowrap}
.brand small{display:block;font-size:12px;font-weight:500;color:var(--faint);letter-spacing:.2em;line-height:1.2;white-space:nowrap}
.local{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);border:2px solid var(--line);border-radius:1000px;padding:2px 12px;white-space:nowrap}

/* 版面 */
main{max-width:1760px;margin:0 auto;padding:24px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media(min-width:900px){
  main{grid-template-columns:288px minmax(0,1fr);align-items:start}
  aside{position:sticky;top:90px;max-height:calc(100vh - 114px);overflow:auto}
}
@media(max-width:899px){header{position:static}main{padding:16px;gap:16px}.work{order:-1}}
.work{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;min-width:0;align-items:start}

.panel{background:#fff;border:2px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.sec{padding:16px 20px 20px}
.sec+.sec{border-top:2px solid var(--line)}
.sec-t{font-size:16px;font-weight:700;letter-spacing:.08em;white-space:nowrap;display:flex;align-items:baseline;gap:8px}
.sec-en{font-size:12px;font-weight:500;color:var(--faint);letter-spacing:.2em}
.lbl{font-size:14px;font-weight:500;color:var(--ink-2);margin:16px 0 8px}
.hint{font-size:14px;color:var(--mute);line-height:1.7;margin-top:10px}

/* 步驟標題 */
.card-hd{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.stn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;flex:none}
.stp{font-size:16px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
.pill{font-size:12px;font-weight:500;color:var(--accent-ink);background:var(--accent-soft);border:2px solid var(--accent-line);border-radius:1000px;padding:0 12px;white-space:nowrap}
.pill:empty{display:none}
.card-bd{padding:20px;display:flex;flex-direction:column;gap:16px}

textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;resize:vertical;line-height:1.7;min-height:240px}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--accent)}
textarea.out{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:12px;background:#FAFBFC;min-height:140px;line-height:1.6;word-break:break-all}
input[type=text]{height:36px;border:2px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;min-width:0;width:100%}
input[type=color]{width:44px;height:36px;padding:2px;border:2px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;flex:none}

/* 品牌 chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:1000px;padding:2px 14px;font-size:14px;color:var(--ink-2);white-space:nowrap}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.dots{display:inline-flex}
.dots i{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--line)}
.dots i+i{margin-left:2px}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.b-act{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px}
.b-act .btn{justify-content:center;width:100%}
.b-act .del:hover{border-color:#b71c22;color:#b71c22;background:#fff}
.colors label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);white-space:nowrap}
.save-row{display:flex;gap:8px;margin-top:12px}

details.adv{margin-top:16px;border-top:2px dashed var(--line);padding-top:12px}
details.adv summary{cursor:pointer;font-weight:500;color:var(--accent-ink);list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::before{content:'▸';color:var(--mute);transition:transform .15s}
details.adv[open] summary::before{transform:rotate(90deg)}
/* 開關 */
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;position:relative;line-height:1.35;margin-top:14px}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw-ui{width:36px;height:20px;border-radius:1000px;background:#D1D5DB;position:relative;flex:none;transition:background .15s}
.sw-ui::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.18);transition:transform .15s}
.sw input:checked+.sw-ui{background:var(--accent)}
.sw input:checked+.sw-ui::after{transform:translateX(16px)}
.sw input:focus-visible+.sw-ui{outline:2px solid var(--accent);outline-offset:2px}

/* 按鈕 */
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border:2px solid var(--accent);background:#fff;color:var(--accent-ink);border-radius:10px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--accent-soft)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.ghost{border-color:var(--line);color:var(--ink-2)}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:36px;padding:0 14px}

/* 智慧提示 */
.notes{display:flex;flex-direction:column;gap:8px}
.note{display:flex;gap:8px;align-items:flex-start;border:2px solid var(--accent-line);background:var(--accent-soft);border-radius:12px;padding:8px 14px;color:var(--ink-2);font-size:14px;line-height:1.6}
.note.warn{border-color:var(--warn-line);background:var(--warn-soft);color:var(--warn)}
.note.ok{border-color:#BFE0C1;background:#F4FAF4;color:var(--ok)}
.note b{color:var(--ink)}
.note.warn b{color:var(--warn)}

.card-bd{padding:16px 20px;gap:12px}
#src{min-height:110px;height:150px}
textarea.out{min-height:56px;height:72px}
@media(min-width:900px){
  .work{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-auto-rows:minmax(calc(100vh - 128px),auto);align-items:stretch;gap:16px}
  .work>.panel{display:flex;flex-direction:column;min-height:0}
  .work>.panel .card-bd{flex:1;min-height:0}
  .work #src{flex:1;height:auto;min-height:200px;resize:none}
  .work textarea.out{flex:none;height:220px}
  .work iframe{flex:1;height:auto;min-height:260px}
}
.empty{border:2px dashed var(--line);border-radius:12px;padding:40px 16px;text-align:center;color:var(--faint)}
iframe{width:100%;height:320px;transition:height .15s;border:2px solid var(--line);border-radius:12px;background:#fff}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#fff;color:var(--ok);border:2px solid var(--ok);padding:8px 20px;border-radius:1000px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;box-shadow:var(--shadow);z-index:50}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="brandwrap">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M9 9h6M9 13h4"/></svg></div>
      <div class="brand"><b>QA 轉 HTML</b><small>FAQ ACCORDION</small></div>
    </div>
    <span class="local">資料只在這台電腦處理，不會上傳</span>
  </div>
</header>

<main>
  <aside>
    <div class="panel">
      <div class="sec">
        <div class="sec-t">品牌配色 <span class="sec-en">BRAND</span></div>
        <div class="chips" style="margin-top:12px" id="chips"></div>
        <div class="hint" id="brandHint"></div>
        <details class="adv"><summary>調整顏色／儲存品牌</summary>
        <div class="lbl">設定品牌色（調完按「儲存顏色」）</div>
        <div class="colors">
          <label><input type="color" id="qc" value="#006D79">問題文字</label>
          <label><input type="color" id="ic" value="#b71c22">＋ 符號</label>
        </div>
        <div class="lbl">品牌名稱</div>
        <input type="text" id="bname" placeholder="留空＝更新目前品牌">
        <div class="hint" style="margin-top:8px">填新名字＝另存成新品牌</div>
        <div class="b-act">
          <button class="btn sm pri" type="button" onclick="saveBrand()">儲存顏色</button>
          <button class="btn sm ghost del" type="button" onclick="delBrand()">刪除目前品牌</button>
        </div>
        </details>
      </div>
      <div class="sec">
        <div class="sec-t">展開符號 <span class="sec-en">ICON</span></div>
        <div class="chips" id="symChips" style="margin-top:12px"></div>
        <label class="sw" style="margin-top:12px"><input type="checkbox" id="noJs"><span class="sw-ui"></span>不用 JS 版（促銷賣場用）</label>
        <details class="adv"><summary>更多設定（標題、其他）</summary>
        <input type="hidden" id="fsT" value="20"><input type="hidden" id="fsI" value="20"><input type="hidden" id="fsQ" value=""><input type="hidden" id="fsA" value="">
        <label class="sw"><input type="checkbox" id="normP" checked><span class="sw-ui"></span>半形標點自動改全形（只動標點）</label>
        <label class="sw"><input type="checkbox" id="numQ" checked><span class="sw-ui"></span>問題加編號（Q1、Q2…）</label>
        <input type="hidden" id="symC" value="＋"><input type="hidden" id="symO" value="−">
        <div class="lbl">標題文字</div>
        <input type="text" id="title" value="常見問題｜Q&amp;A">
        <label class="sw"><input type="checkbox" id="showTitle" checked><span class="sw-ui"></span>輸出標題</label>
        <label class="sw"><input type="checkbox" id="withCss" checked><span class="sw-ui"></span>附帶 CSS 與 JS（可直接整段貼）</label>
        <label class="sw"><input type="checkbox" id="firstOpen"><span class="sw-ui"></span>第一題預設展開</label>
        </details>
      </div>
    </div>
  </aside>

  <div class="work">
    <section class="panel">
      <div class="card-hd">
        <span class="stn">1</span><span class="stp">貼上 Q&amp;A 文字</span>
        <span class="pill" id="stat"></span>
        <button class="btn ghost sm" type="button" onclick="clearAll()" style="margin-left:auto">清除</button>
      </div>
      <div class="card-bd">
        <textarea id="src" placeholder="Q：問題一？&#10;A：答案一&#10;Q：問題二？&#10;A：答案第一行&#10;1. 條列也可以&#10;2. 會自動換行"></textarea>
        <div class="notes" id="notes"></div>
      </div>
    </section>

    <section class="panel">
      <div class="card-hd"><span class="stn">2</span><span class="stp">轉換結果</span><span class="pill" style="background:#fff;color:var(--mute);border-color:var(--line)">預覽可點問題展開</span>
        <button class="btn pri sm" type="button" onclick="copyOut()" style="margin-left:auto">複製 HTML</button></div>
      <div class="card-bd">
        <textarea id="out" class="out" readonly placeholder="這裡會出現 HTML"></textarea>
        <iframe id="pv"></iframe>
      </div>
    </section>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/®/g,'&reg;').replace(/…/g,'&hellip;');
const attr=s=>s.replace(/</g,'&lt;').replace(/"/g,'&quot;');

/* ---------- 智慧解析 ---------- */
const QRE=/^[QＱ]\s*[\d０-９]*\s*[：:.．、)）]\s*|^問\s*[：:]\s*/i;
const ARE=/^[AＡ]\s*[\d０-９]*\s*[：:.．、)）]\s*|^答\s*[：:]\s*/i;
function parse(text,norm){
  const items=[],fixes=new Set();
  text=text.replace(/\r/g,'').replace(/[​﻿]/g,'');
  if(/["“”]{2}/.test(text))fixes.add('原文有連續的 "" 符號，已照原樣保留，請自行確認');
  const lastRaw=text.split('\n').filter(l=>l.trim()).pop();
  let cur=null,mode=null;
  for(const raw of text.split('\n')){
    let line=raw.trim();
    if(/^["“”]\s*(?=[QAＱＡ問答]\s*\d*\s*[：:.．、)）])/i.test(line)){line=line.replace(/^["“”]\s*/,'');fixes.add('已清掉前後多餘的引號');}
    if(raw===lastRaw&&/["“”]$/.test(line)&&(line.match(/["“”]/g)||[]).length%2===1){line=line.replace(/["“”]$/,'').trim();fixes.add('已清掉前後多餘的引號');}
    if(!line){if(cur&&mode==='a'&&cur.a.length&&cur.a[cur.a.length-1]!=='')cur.a.push('');continue;}
    if(QRE.test(line)){
      cur={q:line.replace(QRE,'').trim(),a:[]};items.push(cur);mode='q';
    }else if(ARE.test(line)){
      if(!cur){cur={q:'',a:[]};items.push(cur);}
      const t=line.replace(ARE,'').trim();if(t)cur.a.push(t);mode='a';
    }else if(cur){
      if(mode==='q')cur.q+=line;else cur.a.push(line);
    }
  }
  // 完全沒有 Q／A 標記時，自動判斷分段（只分段，文字一個字都不動）
  if(!items.length&&text.trim()){
    const L=text.split('\n').map(s=>s.trim());
    const nonEmpty=L.filter(Boolean);
    const isQ=s=>/[？?]\s*["”」』）)]*$/.test(s);
    let how='';
    if(nonEmpty.some(isQ)){
      let c=null;
      for(const s of L){
        if(!s){if(c&&c.a.length&&c.a[c.a.length-1]!=='')c.a.push('');continue;}
        if(isQ(s)){c={q:s,a:[]};items.push(c);}
        else{if(!c){c={q:'',a:[]};items.push(c);}c.a.push(s);}
      }
      how='以「？」結尾的行當問題，其後到下一個問題之前當答案';
    }else if(L.some(s=>!s)){
      let c=null,fresh=true;
      for(const s of L){
        if(!s){fresh=true;continue;}
        if(fresh){c={q:s,a:[]};items.push(c);fresh=false;}else c.a.push(s);
      }
      how='每一段（空行分隔）的第一行當問題，其餘當答案';
    }else if(nonEmpty.length>=2&&nonEmpty.length%2===0){
      for(let i=0;i<nonEmpty.length;i+=2)items.push({q:nonEmpty[i],a:[nonEmpty[i+1]]});
      how='單數行當問題、雙數行當答案';
    }
    if(how)fixes.add('沒有 Q／A 標記，已自動判斷：'+how+'，請確認分段是否正確');
  }
  let changed=0;
  const P={'?':'？','!':'！',',':'，',';':'；',':':'：',')':'）'};
  const cjk=/[㐀-鿿　-〿＀-￯]/;
  const normP=s=>{
    let out='';
    for(let i=0;i<s.length;i++){
      const c=s[i],p=out.slice(-1),n=s[i+1]||'';
      let r=c;
      if(P[c]&&cjk.test(p)&&!(c===':'&&/\d/.test(n)))r=P[c];
      else if(c==='('&&(cjk.test(n)||cjk.test(p)))r='（';
      else if(c===')'&&!P[c])r=c;
      if(r!==c)changed++;
      out+=r;
    }
    return out;
  };
  items.forEach(it=>{
    while(it.a.length&&it.a[it.a.length-1]==='')it.a.pop();
    if(norm){it.q=normP(it.q);it.a=it.a.map(normP);}
  });
  if(changed)fixes.add(`已把 ${changed} 處半形標點統一成全形（只動標點，文字不變）`);
  return {items:items.filter(i=>i.q||i.a.length),fixes:[...fixes]};
}

/* ---------- 品牌（含自動辨識） ---------- */
const KEY='qa-brands-v2';
const DEFAULTS={
  '達摩本草':{qc:'#093c71',ic:'#b71c22',kw:['達摩本草','達摩']},
  '毛孩時代':{qc:'#6fc3b3',ic:'#b71c22',kw:['毛孩時代']},
  '御熹堂':{qc:'#b71c22',ic:'#b71c22',kw:['御熹堂']},
  'PowerHero':{qc:'#000000',ic:'#b71c22',kw:['powerhero','power hero','快充有神','PH ']},
  '芙木之光':{qc:'#c4715c',ic:'#b71c22',kw:['芙木之光']},
  'TRYME':{qc:'#ffcfc9',ic:'#b71c22',kw:['tryme']},
  '大島生醫':{qc:'#b8925a',ic:'#b71c22',kw:['大島生醫','大島']},
  'XXS':{qc:'#ff4b7f',ic:'#b71c22',kw:['xxs']},
  '奧沛':{qc:'#29abe2',ic:'#b71c22',kw:['奧沛']},
  '優固倍':{qc:'#60269e',ic:'#b71c22',kw:['優固倍']}
};
let memBrands={};
function userBrands(){let u={};try{u=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}return Object.assign({},u,memBrands)}
/* 雲端同步（存在 Google 帳號的應用程式專用資料夾；本機開啟時沒有雲端，只存這台電腦） */
let cloudSynced=false,pulling=false,pullFailed=false;
const getCloud=()=>{try{return parent!==window&&parent.opsCloud||null}catch(e){return null}};
function pushCloud(){
  const c=getCloud();if(!c)return;
  c.save(userBrands()).catch(()=>toast('已存在這台電腦，但同步到 Google 帳號失敗'));
}
function pullCloud(interactive){
  const c=getCloud();if(!c||cloudSynced||pulling||pullFailed)return;
  pulling=true;
  c.load(interactive).then(o=>{
    cloudSynced=true;
    if(o===null){if(Object.keys(userBrands()).length)c.save(userBrands()).catch(()=>{});return;}
    if(!o||typeof o!=='object')return;
    try{localStorage.setItem(KEY,JSON.stringify(o));memBrands={};}catch(e){memBrands=o;}
    renderChips();autoBrand();renderChips();build();
  }).catch(()=>{if(interactive)pullFailed=true;}).then(()=>{pulling=false;});
}
function allBrands(){return Object.assign({},DEFAULTS,userBrands())}
let cur='',locked=false;
function detectBrand(text){
  const t=text.toLowerCase();let best='',score=0;
  for(const [n,b] of Object.entries(allBrands())){
    const kws=(b.kw&&b.kw.length?b.kw:[n]).concat([n]);
    let s=0;kws.forEach(k=>{const kk=k.toLowerCase();let i=-1;while((i=t.indexOf(kk,i+1))>=0)s++;});
    if(s>score){score=s;best=n;}
  }
  return best;
}
function renderChips(){
  const b=allBrands();
  let h=`<button class="chip${!locked?' on':''}" type="button" data-b="">自動判斷</button>`;
  h+=Object.entries(b).map(([n,v])=>`<button class="chip${locked&&cur===n?' on':''}" type="button" data-b="${attr(n)}"><span class="dots"><i style="background:${v.qc}"></i><i style="background:${v.ic}"></i></span>${esc(n)}</button>`).join('');
  $('chips').innerHTML=h;
  $('brandHint').textContent=locked?(cur?`已指定：${cur}`:'自訂顏色'):(cur?`已自動判斷為「${cur}」，可手動改選`:'偵測不到品牌，使用目前顏色');
}
$('chips').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  const n=c.dataset.b;
  if(!n){locked=false;autoBrand();}
  else{locked=true;cur=n;const v=allBrands()[n];$('qc').value=v.qc;$('ic').value=v.ic;}
  renderChips();build();
});
function autoBrand(){
  if(locked)return;
  const n=detectBrand($('src').value);
  if(n){cur=n;const v=allBrands()[n];$('qc').value=v.qc;$('ic').value=v.ic;}
  else cur='';
}
['qc','ic'].forEach(id=>$(id).addEventListener('input',()=>{locked=true;renderChips();build();}));
function saveBrand(){
  const n=$('bname').value.trim()||cur;
  if(!n)return toast('請先選品牌或輸入新品牌名稱');
  const u=userBrands();u[n]={qc:$('qc').value,ic:$('ic').value,kw:[n]};
  let saved=true;
  try{localStorage.setItem(KEY,JSON.stringify(u))}catch(e){saved=false;memBrands[n]=u[n];}
  pushCloud();
  locked=true;cur=n;$('bname').value='';renderChips();toast(saved?'已儲存品牌：'+n:'已套用（此瀏覽器無法永久儲存，關閉後會消失）');
}
function delBrand(){
  if(!cur)return toast('請先選一個品牌');
  if(DEFAULTS[cur])return toast('內建品牌不能刪');
  const u=userBrands();delete u[cur];delete memBrands[cur];
  try{localStorage.setItem(KEY,JSON.stringify(u))}catch(e){}
  pushCloud();
  toast('已刪除：'+cur);locked=false;cur='';autoBrand();renderChips();build();
}

/* ---------- 產生 HTML ---------- */
const CSS=(C,O,FS)=>`<@@CM@@!-- CSS樣式 -->
<style type="text/css">.accordion {

  border: 1px solid #ddd;

  flex: 1;${FS.q?`
  font-size: ${FS.q}px;`:''}

<@@CM@@!-- JS互動功能 --><script type="text/javascript">
function toggleAccordion(element) {
  const accordion = element.parentElement;
  const icon = element.querySelector('.accordion-toggle-icon');
  accordion.classList.toggle('open');
  icon.textContent = accordion.classList.contains('open') ? "${O}" : "${C}";
}
<\/script>`;

/* 預覽高度跟著內容走，展開收合時也同步，不出現內層捲軸 */
function fitPv(){
  try{
    const f=$('pv'),d=f.contentDocument;if(!d||!d.body)return;
    f.style.height=Math.max(160,d.documentElement.scrollHeight+4)+'px';
  }catch(e){}
}
function renderNotes(notes){
  const info=notes.filter(n=>!n[0]).map(n=>n[1]);
  const rest=notes.filter(n=>n[0]);
  let h=rest.map(([c,t])=>`<div class="note ${c}">${t}</div>`).join('');
  if(info.length)h+=`<div class="note">${info.join('　·　')}</div>`;
  $('notes').innerHTML=h;
}
let lastLen=0;
function build(){
  const {items,fixes}=parse($('src').value,$('normP').checked);
  $('stat').textContent=items.length?`已辨識 ${items.length} 題`:'';
  // 智慧提示
  const notes=[];
  if(!locked&&cur&&items.length)notes.push(['',`已自動套用品牌「<b>${esc(cur)}</b>」的配色`]);
  fixes.forEach(f=>notes.push(['',esc(f)]));
  const noA=items.map((x,i)=>[x,i+1]).filter(([x])=>!x.a.length).map(([,i])=>i);
  const noQ=items.map((x,i)=>[x,i+1]).filter(([x])=>!x.q).map(([,i])=>i);
  if(noA.length)notes.push(['warn',`第 <b>${noA.join('、')}</b> 題沒有答案，請檢查`]);
  if(noQ.length)notes.push(['warn',`第 <b>${noQ.join('、')}</b> 題沒有問題文字，請檢查`]);
  const seen={},dup=[];items.forEach((x,i)=>{if(!x.q)return;if(seen[x.q])dup.push(i+1);else seen[x.q]=1;});
  if(dup.length)notes.push(['warn',`第 <b>${dup.join('、')}</b> 題的問題重複了`]);
  if($('src').value.trim()&&!items.length)notes.push(['warn','沒有找到「Q：」開頭的問題，請確認格式']);
  renderNotes(notes);

  document.querySelector('.work').classList.toggle('has',items.length>0);
  if(!items.length){$('out').value='';$('pv').srcdoc='';return;}
  const SC=$('symC').value||'＋',SO=$('symO').value||'−';
  const qc=$('qc').value,ic=$('ic').value,first=$('firstOpen').checked,num=$('numQ').checked;
  const n=id=>{const v=parseInt($(id).value,10);return v>0?v:0};
  const FS={q:n('fsQ'),a:n('fsA'),i:n('fsI')||20},tsz=n('fsT')||20;
  let h='';
  if($('showTitle').checked&&$('title').value.trim())
    h+=`<div style="text-align: center; font-size: ${tsz}px; font-weight: bold; margin-bottom: 20px;">${esc($('title').value.trim())}</div>\n`;
  const noJs=$('noJs').checked;
  h+='<@@CM@@!-- FAQ 區塊開始 -->\n';
  items.forEach((it,i)=>{
    const open=first&&i===0;
    if(noJs){
      // 不用 JS 版：純 HTML 的 <details>，樣式全寫在標籤上，不需要 <style> 與 <script>
      h+=`<@@CM@@!-- FAQ ${i+1} -->\n<details${open?' open':''} style="border: 1px solid #ddd; border-radius: 10px; margin-bottom: 10px; background: #fff; padding: 15px; overflow: hidden;">\n`+
`<summary style="display: flex; justify-content: space-between; align-items: center; cursor: pointer; list-style: none;">\n<span class="accordion-question" style="flex: 1; font-weight: bold; color: ${qc};${FS.q?` font-size: ${FS.q}px;`:''}">${num?'Q'+(i+1):'Q'}：${esc(it.q)}</span>\n<span style="color: ${ic}; font-size: ${FS.i}px; margin-left: 10px; flex-shrink: 0;">${esc(SC)}</span>\n</summary>\n`+
`<div class="accordion-content" style="margin-top: 12px; line-height: 1.6;${FS.a?` font-size: ${FS.a}px;`:''}">${it.a.map(esc).join('<br />\n')}</div>\n</details>\n`;
      return;
    }
    h+=`<@@CM@@!-- FAQ ${i+1} -->\n<div class="accordion${open?' open':''}">\n`+
`<div class="accordion-header" onclick="toggleAccordion(this)">\n<div class="accordion-question" style="color: ${qc};">${num?'Q'+(i+1):'Q'}：${esc(it.q)}</div>\n<div class="accordion-toggle-icon" style="color: ${ic};">${esc(open?SO:SC)}</div>\n</div>\n`+
`<div class="accordion-content">${it.a.map(esc).join('<br />\n')}</div>\n</div>\n`;
  });
  h+='<@@CM@@!-- FAQ 區塊結束 -->';
  if(!noJs&&$('withCss').checked)h+='\n'+CSS(SC,SO,FS);
  $('out').value=h;
  // 文字核對：原文與輸出，比對所有文字與數字（忽略標點、空白、Q/A 標記）
  try{
    const core=s=>(s.match(/[\p{L}\p{N}]/gu)||[]).join('');
    const srcCore=core($('src').value.split('\n').map(l=>l.trim().replace(/^["“”]\s*(?=[QAＱＡ問答])/,'').replace(QRE,'').replace(ARE,'')).join(''));
    const d=new DOMParser().parseFromString(h,'text/html');
    const outCore=core([...d.querySelectorAll('.accordion-question,.accordion-content')].map(e=>e.textContent.replace(/^Q\d*：/,'')).join(''));
    if(srcCore===outCore)notes.unshift(['ok','✓ 已核對：原文所有文字與數字都在，沒有增減']);
    else notes.unshift(['warn','⚠ 文字核對不一致（原文 '+srcCore.length+' 字，輸出 '+outCore.length+' 字），請檢查']);
    renderNotes(notes);
  }catch(e){}
  $('pv').srcdoc='<body style="font-family:sans-serif;margin:12px">'+h+(noJs||$('withCss').checked?'':CSS(SC,SO,FS));
}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
function copyText(t,msg){
  const done=()=>toast(msg||'已複製 HTML');
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,()=>{$('out').select();document.execCommand('copy');done()});
  else{$('out').select();document.execCommand('copy');done();}
}
function copyOut(){if(!$('out').value)return toast('還沒有內容');copyText($('out').value);}
function download(){
  if(!$('out').value)return toast('還沒有內容');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([$('out').value],{type:'text/html'}));
  a.download='faq.html';a.click();
}
function clearAll(){$('src').value='';locked=false;cur='';renderChips();build();}
async function pasteClip(){
  try{const t=await navigator.clipboard.readText();if(!t.trim())return toast('剪貼簿是空的');$('src').value=t;onSrc(true);}
  catch(e){toast('瀏覽器擋住讀取，請直接在框內按 Ctrl+V');}
}
function onSrc(){
  autoBrand();renderChips();build();
}
$('src').addEventListener('input',()=>onSrc(false));
$('src').addEventListener('paste',()=>setTimeout(()=>onSrc(true),0));
const SYMS=[['＋','−'],['(+)','(−)'],['+','-'],['(一)','(一)'],['▼','▲']];
function renderSyms(){
  const c=$('symC').value,o=$('symO').value;
  $('symChips').innerHTML=SYMS.map(([a,b],i)=>'<button class="chip'+(a===c&&b===o?' on':'')+'" type="button" data-i="'+i+'">'+esc(a)+' / '+esc(b)+'</button>').join('');
}
$('symChips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;const s=SYMS[c.dataset.i];$('symC').value=s[0];$('symO').value=s[1];renderSyms();build();});
['symC','symO'].forEach(id=>$(id).addEventListener('input',()=>{renderSyms();build();}));
['title','withCss','noJs','showTitle','firstOpen','numQ','normP','fsT','fsI','fsQ','fsA'].forEach(id=>$(id).addEventListener('input',build));
pullCloud(false);
document.addEventListener('pointerdown',()=>pullCloud(true));
renderChips();renderSyms();build();
<@@SC@@/script>

.sec.closed .sec-bd{display:none}

.lbl{font-size:14px;font-weight:500;color:var(--ink-2);margin:16px 0 8px}
.hint{font-size:14px;color:var(--mute);line-height:var(--lh-body);margin-top:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.unit{font-size:14px;color:var(--mute);white-space:nowrap}
.val{min-width:44px;text-align:right;font-size:14px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{height:36px;border:0;background:transparent;padding:0 6px;white-space:nowrap;color:var(--ink-2);font-size:14px}
.seg button+button{border-left:2px solid var(--line)}
.seg button:hover{background:var(--hover);color:var(--ink)}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700;box-shadow:inset 0 0 0 2px var(--accent)}
input[type=number],input[type=text],select,textarea{height:36px;border:2px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;min-width:0}
input[type=number]{width:96px;font-variant-numeric:tabular-nums}
input[type=text]{width:140px}
textarea{width:100%;height:auto;min-height:36px;padding:4px 10px;resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=color]{width:44px;height:36px;padding:2px;border:2px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:2px solid var(--line);background:#fff;border-radius:1000px;padding:2px 12px;font-size:14px;color:var(--ink-2);white-space:nowrap}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:500}

/* 開關 */
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;position:relative;line-height:var(--lh-title)}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw-ui{width:36px;height:20px;border-radius:1000px;background:#D1D5DB;position:relative;flex:none;transition:background .15s}
.sw-ui::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.18);transition:transform .15s}
.sw input:checked+.sw-ui{background:var(--accent)}
.sw input:checked+.sw-ui::after{transform:translateX(16px)}
.sw input:focus-visible+.sw-ui{outline:2px solid var(--accent);outline-offset:2px}
.sw.mt{margin-top:14px}

/* 快速套用 */
.presets{display:grid;gap:8px}
.preset{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left}
.preset:hover{border-color:var(--line-strong);background:var(--hover)}
.preset.on{border-color:var(--accent);background:var(--accent-soft)}
.preset .pi{width:36px;height:36px;border-radius:10px;background:var(--hover);display:grid;place-items:center;flex:none;color:var(--ink)}
.preset.on .pi{background:var(--accent);color:#fff}
.preset .pi .ico{width:18px;height:18px}
.preset b{display:block;font-size:14px;font-weight:700;line-height:var(--lh-title)}
.preset .pt>span{display:block;font-size:14px;color:var(--mute);line-height:var(--lh-title);margin-top:2px}
.preset .pi img{width:100%;height:100%;object-fit:contain;border-radius:8px;background:#fff}
.preset .pt{min-width:0}
.kbq{margin-top:14px}
.adv{display:block;width:100%;text-align:left;background:none;border:0;border-top:2px solid var(--line);padding:16px 20px;font:inherit;font-size:14px;font-weight:700;color:var(--ink-2);letter-spacing:var(--ls-title);cursor:pointer}
.adv:hover{background:var(--bg,#f7f8fa)}
.adv .tg{float:right;color:var(--accent);font-weight:700;white-space:nowrap}
.pdfbox{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.pdfsub{font-size:14px;font-weight:400;color:var(--mute);margin-left:12px;white-space:normal}
.pdfrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pdfrow .unit{min-width:64px;white-space:nowrap}
.pdfrow .seg{flex:0 1 auto}
.stn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-style:normal;font-weight:700;margin-right:8px;flex:none}
.stp{font-size:16px;font-weight:700;color:var(--ink);display:flex;align-items:center;white-space:nowrap}
@media(width<900px){.stn{display:none}}
.adv>span:not(.tg){display:block;font-size:12px;font-weight:400;color:var(--mute);letter-spacing:var(--ls-body);margin-top:2px}
.plan{background:var(--accent-soft);border:2px solid var(--accent-line);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);line-height:var(--lh-title)}
.plan .pl{font-weight:700;color:var(--accent-ink);white-space:nowrap}
.plan .st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.plan .st b{color:var(--ink);font-weight:700}
.plan .ar{color:var(--faint)}
.mine{margin-top:16px;padding-top:14px;border-top:2px dashed var(--line)}
.mine .lbl{margin:0 0 8px}
.mine .lbl{cursor:pointer;display:flex;justify-content:space-between;font-weight:700;user-select:none}
.mine .lbl::after{content:'展開 ▾';color:var(--accent);font-weight:700}
.mine:not(.closed) .lbl::after{content:'收起 ▴'}
.mine.closed>:not(.lbl){display:none}
.mine.closed .lbl{margin:0}
.sec[data-sec=preset] .presets:not(#myList) .pt>span{display:none}
.sec[data-sec=preset] .presets:not(#myList) .preset{padding:8px 12px}
.sec[data-sec=preset] .presets:not(#myList){gap:6px}
.mine-empty{margin:0 0 10px;font-size:14px;color:var(--mute);line-height:var(--lh-body)}
.mine #myList{margin-bottom:10px}
.mine #myList:empty{display:none}
.uprow{display:flex;align-items:center;gap:4px}
.uprow .preset{flex:1;min-width:0}
.uprow .ib{border-color:transparent;background:transparent;color:var(--faint)}
.uprow .ib:hover{border-color:var(--warn-line);background:#fff;color:var(--warn)}
.mine-form input{width:100%}
.ferr{margin:6px 0 0;font-size:14px;color:var(--warn)}
.mine-io{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:8px}

/* 加工 */
.xcard{border:2px solid var(--line);border-radius:12px;margin-top:10px}
.xcard:first-child{margin-top:0}
.xcard.on{border-color:var(--line-strong)}
.xhd{padding:12px}
.xhd .xt{font-weight:500;flex:1}
.xhd .ico{color:var(--mute)}
.xbd{border-top:2px solid var(--line);padding:4px 12px 14px}
.xbd .row{flex-wrap:nowrap}
.xbd input[type=range]{min-width:64px}
.asset{height:36px;max-width:96px;object-fit:contain;border:2px solid var(--line);border-radius:8px;background:repeating-conic-gradient(#EEF0F2 0 25%,#fff 0 50%) 0 0/12px 12px}
.asset[src=""]{display:none}
.pos{display:grid;grid-template-columns:repeat(3,32px);gap:4px}
.pos button{width:32px;height:24px;border:2px solid var(--line);background:#fff;border-radius:6px;padding:0}
.pos button:hover{border-color:var(--line-strong);background:var(--hover)}
.pos button.on{background:var(--accent);border-color:var(--accent)}

/* 拼圖版型 */
.layouts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lay{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px;aspect-ratio:1}
.lay svg{width:100%;height:100%;display:block}
.lay svg rect{fill:#E5E7EB}
.lay:hover{border-color:var(--line-strong)}
.lay.on{border-color:var(--accent);background:var(--accent-soft)}
.lay.on svg rect{fill:var(--accent)}

/* ===== 按鈕 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border:2px solid var(--line);background:#fff;border-radius:10px;font-weight:500;font-size:14px;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--hover);border-color:var(--line-strong)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.sm{height:32px;padding:0 10px;border-radius:8px}
.btn.full{width:100%}
.btn.dark{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dark:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn:disabled,.ib:disabled{opacity:.4;cursor:not-allowed}
.ib{width:32px;height:32px;display:inline-grid;place-items:center;padding:0;border:2px solid var(--line);background:#fff;border-radius:8px;color:var(--ink-2)}
.ib svg{width:16px;height:16px}
.ib:hover{background:var(--hover);border-color:var(--line-strong);color:var(--ink)}
.ib.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.ib.danger:hover{color:var(--warn);border-color:var(--warn-line);background:#fff}

/* ===== 工作區 ===== */
.work{display:flex;flex-direction:column;gap:16px;min-width:0}
.drop{border:2px dashed var(--line-strong);background:#fff;border-radius:16px;padding:40px 24px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;transition:border-color .15s,background .15s}
.drop:hover{border-color:var(--faint);background:#FCFCFD}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .ic{width:56px;height:56px;border-radius:16px;background:var(--hover);color:var(--ink);display:grid;place-items:center}
.drop .ic .ico{width:28px;height:28px}
.drop .dt b{display:block;font-size:18px;font-weight:700;letter-spacing:var(--ls-title);line-height:var(--lh-title)}
.drop .dt p{margin:6px 0 0;font-size:14px;color:var(--mute);line-height:var(--lh-body)}
.drop .dt .fmt{font-size:12px;color:var(--faint);margin-top:2px}
.drop .p-compact{display:none}
.drop.compact{flex-direction:row;text-align:left;padding:14px 20px;gap:16px}
.drop.compact .ic{width:40px;height:40px;border-radius:12px}
.drop.compact .ic .ico{width:20px;height:20px}
.drop.compact .dt{flex:1;min-width:0}
.drop.compact .dt b{font-size:16px}
.drop.compact .dt p{margin-top:2px}
.drop.compact .p-full,.drop.compact .fmt{display:none}
.drop.compact .p-compact{display:block}

.feats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(width<700px){.feats{grid-template-columns:minmax(0,1fr)}}
.nw{white-space:nowrap}
.feat{background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:flex-start}
.feat .fi{width:36px;height:36px;border-radius:10px;background:var(--hover);display:grid;place-items:center;flex:none;color:var(--ink)}
.feat .fi .ico{width:18px;height:18px}
.feat b{display:block;font-size:14px;font-weight:700;line-height:var(--lh-title)}
.feat span{display:block;font-size:14px;color:var(--mute);line-height:var(--lh-body);margin-top:2px}
.feat span.nw{display:inline;margin:0}

/* 統計列 */
.bar{position:sticky;top:90px;z-index:5;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 20px;display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap;box-shadow:var(--shadow);overflow:hidden}
@media(width<900px){.bar{top:0}}
.stats{display:flex;gap:8px 28px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat-l{font-size:12px;color:var(--mute);white-space:nowrap;line-height:var(--lh-title)}
.stat-n{font-size:20px;font-weight:700;white-space:nowrap;line-height:var(--lh-title);font-variant-numeric:tabular-nums}
.stat-n.warn{color:var(--warn)}
.bar .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.busy{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);white-space:nowrap}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.prog{position:absolute;left:0;right:0;bottom:0;height:4px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

/* 圖片卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:#fff;border:2px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.card.dragging{opacity:.4}
.card.dropto{border-color:var(--accent)}
.pv{position:relative;aspect-ratio:1/1;border-bottom:2px solid var(--line);background:repeating-conic-gradient(#F3F4F6 0 25%,#fff 0 50%) 0 0/16px 16px;cursor:zoom-in;overflow:hidden}
.pv img{display:block;width:100%;height:100%;object-fit:contain}
.pv .st{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.72);font-size:14px;color:var(--ink-2)}
.pv .st svg{width:28px;height:28px}
.card.wait .st,.card.run .st,.card.err .st{display:flex}
.card.err .st{background:#fff;color:var(--warn)}
.card.err .pv{cursor:default}
.pv .hov{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(31,41,51,.82);color:#fff;font-size:12px;padding:4px 10px;border-radius:1000px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none}
.card.done .pv:hover .hov{opacity:1}
.cb{padding:12px 14px 4px;display:flex;flex-direction:column;gap:6px;flex:1}
.cn{font-size:14px;font-weight:700;line-height:var(--lh-title)}
.cm{display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--mute);line-height:var(--lh-title);font-variant-numeric:tabular-nums}
.cm b{color:var(--ink);font-weight:700}
.cm .orig{font-size:12px;color:var(--faint)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.bd{font-size:12px;font-weight:500;line-height:20px;border:2px solid;border-radius:1000px;padding:0 8px;background:#fff}
.bd.ok{color:var(--ok);border-color:var(--ok-line)}
.bd.save{color:var(--accent-ink);border-color:var(--accent-line)}
.bd.warn{color:var(--warn);border-color:var(--warn-line)}
.bd.info{color:var(--ink-2);border-color:var(--line)}
.errmsg{margin:0;font-size:14px;color:var(--warn);line-height:var(--lh-body)}
.cf{display:flex;align-items:center;gap:6px;padding:10px 14px 14px}
.cf .btn{margin-left:auto}
.card{container-type:inline-size}
@container (width<260px){.cf .btn{width:32px;padding:0}.cf .btn .t{display:none}}
@container (width<200px){.cf [data-a=cmp]{display:none}}
@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .cb{padding:10px 10px 2px}
  .cm{font-size:12px}
  .cf{padding:8px 10px 10px;gap:4px}
  .cf .btn{width:32px;padding:0}
  .cf .btn .t{display:none}
  .stats{gap:8px 20px}
  .bar{position:static}
  .stat-n{font-size:18px}
}

/* 拼圖 */
.stage{background:#fff;border:2px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:var(--shadow)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cvwrap{position:relative;width:100%;max-width:640px;box-shadow:0 0 0 2px var(--line);border-radius:4px;overflow:hidden}
.cvwrap canvas{display:block;width:100%;height:auto}
.cell{position:absolute;display:flex;align-items:center;justify-content:center;border:2px dashed transparent;transition:border-color .1s,background .1s}
.cell.empty{border-color:var(--line-strong);background:rgba(255,255,255,.6);color:var(--mute);font-size:14px;cursor:pointer}
.cell.empty .ce{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.cell.empty .ce svg{width:16px;height:16px}
.cell.empty:hover{border-color:var(--faint);background:rgba(243,244,246,.85);color:var(--ink)}
.cell.over{border-color:var(--accent)!important;background:rgba(0,102,204,.08)!important}
.cell.filled{cursor:grab}
.cell.filled:hover{border:2px solid var(--ink)}
.cell .cx{position:absolute;top:6px;right:6px;display:none;gap:4px}
.cell.filled:hover .cx{display:flex}
.cell .cx button{width:28px;height:28px;border-radius:50%;border:0;padding:6px;background:rgba(31,41,51,.82);color:#fff;display:grid;place-items:center}
.cell .cx button svg{width:16px;height:16px}
.cell .cx button:hover{background:#000}
.cell .cx button.on{background:#fff;color:var(--ink)}
.cell .cadj{position:absolute;left:6px;bottom:6px;font-size:12px;line-height:20px;background:rgba(31,41,51,.82);color:#fff;padding:0 8px;border-radius:1000px;white-space:nowrap;pointer-events:none}
.tip{margin:0;font-size:14px;color:var(--mute);text-align:center;line-height:var(--lh-body)}
.dlrow{display:flex;flex-direction:column;align-items:center;gap:8px}
.cres{font-size:14px;color:var(--ink-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}

/* 視窗 */
.modal{position:fixed;inset:0;background:rgba(17,24,39,.6);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;width:100%;max-width:min(1000px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.24)}
.mhd{display:flex;align-items:center;gap:8px 12px;padding:12px 16px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.mhd b{flex:1;min-width:120px;font-size:16px;line-height:var(--lh-title)}
.mhd .seg{width:180px}
.mbody{flex:1;overflow:auto;background:repeating-conic-gradient(#F3F4F6 0 25%,#fff 0 50%) 0 0/16px 16px}
.cmp{position:relative;margin:0 auto;user-select:none;touch-action:none;cursor:ew-resize}
.cmp img{display:block;width:100%;height:auto;pointer-events:none}
.cmp .top{position:absolute;inset:0}
.cmp .top img{width:100%;height:100%;object-fit:contain;background:#fff}
.cmp .ln{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);transform:translateX(-50%);pointer-events:none}
.cmp .tg{position:absolute;top:10px;font-size:12px;background:rgba(31,41,51,.82);color:#fff;padding:2px 10px;border-radius:1000px;white-space:nowrap;pointer-events:none}
.cmp .tg.tl{left:10px}.cmp .tg.tr{right:10px}
.mft{padding:10px 16px;font-size:14px;color:var(--mute);border-top:2px solid var(--line);display:flex;gap:6px 20px;flex-wrap:wrap}
.edbody{display:flex;justify-content:center;padding:16px;overflow:hidden;background:repeating-conic-gradient(#F3F4F6 0 25%,#fff 0 50%) 0 0/16px 16px}
.edbody canvas{max-width:100%;max-height:calc(100vh - 260px);cursor:grab;touch-action:none;box-shadow:0 0 0 2px var(--accent)}
.edbody canvas:active{cursor:grabbing}
.edctl{padding:12px 16px 16px;border-top:2px solid var(--line)}
.edctl .row:first-child{margin-top:0}
/* 裁切／旋轉 */
.crbody{display:flex;justify-content:center;align-items:center;padding:16px;overflow:hidden;min-height:120px;background:repeating-conic-gradient(#F3F4F6 0 25%,#fff 0 50%) 0 0/16px 16px}
.crwrap{position:relative;line-height:0;touch-action:none;user-select:none;cursor:crosshair;box-shadow:0 0 0 2px var(--line-strong)}
.crwrap canvas{display:block}
.crshade{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.crshade div{position:absolute;box-shadow:0 0 0 4000px rgba(17,24,39,.55)}
.crbox{position:absolute;outline:2px solid #fff;cursor:move;
  background:linear-gradient(to right,transparent calc(33.33% - 2px),rgba(255,255,255,.5) calc(33.33% - 2px) 33.33%,transparent 33.33% calc(66.67% - 2px),rgba(255,255,255,.5) calc(66.67% - 2px) 66.67%,transparent 66.67%),
  linear-gradient(to bottom,transparent calc(33.33% - 2px),rgba(255,255,255,.5) calc(33.33% - 2px) 33.33%,transparent 33.33% calc(66.67% - 2px),rgba(255,255,255,.5) calc(66.67% - 2px) 66.67%,transparent 66.67%)}
.crbox i{position:absolute;width:16px;height:16px;background:#fff;border:2px solid var(--ink);border-radius:4px}
.crbox i[data-h=nw]{left:-8px;top:-8px;cursor:nwse-resize}.crbox i[data-h=ne]{right:-8px;top:-8px;cursor:nesw-resize}
.crbox i[data-h=sw]{left:-8px;bottom:-8px;cursor:nesw-resize}.crbox i[data-h=se]{right:-8px;bottom:-8px;cursor:nwse-resize}
.crbox i[data-h=n]{left:calc(50% - 8px);top:-8px;cursor:ns-resize}.crbox i[data-h=s]{left:calc(50% - 8px);bottom:-8px;cursor:ns-resize}
.crbox i[data-h=w]{top:calc(50% - 8px);left:-8px;cursor:ew-resize}.crbox i[data-h=e]{top:calc(50% - 8px);right:-8px;cursor:ew-resize}
.crbox.lock i[data-h=n],.crbox.lock i[data-h=s],.crbox.lock i[data-h=w],.crbox.lock i[data-h=e]{display:none}
.crtools{display:flex;gap:6px;flex-wrap:wrap}
.crtools .lb{font-size:14px;color:var(--mute);white-space:nowrap;align-self:center;margin-right:2px}
#crRatio{flex:1;min-width:0}
#crRatio button{padding:0 2px}
.crinfo{font-size:14px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.crft{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="brandwrap">
      <div class="mark"><i class="ico" data-ic="image"></i></div>
      <div class="brand"><b>圖片處理工具</b><small>IMAGE TOOL</small></div>
      <span class="local" title="所有處理都在這台電腦的瀏覽器內完成，圖片不會上傳到任何地方"><i class="ico" data-ic="lock"></i>本機處理・不上傳</span>
    </div>
    <nav class="tabs" id="backNav" hidden>
      <button class="tab" data-tab="batch"><i class="ico" data-ic="layers"></i>← 回到壓縮／改尺寸</button>
    </nav>
  </div>
</header>

<main>
  <aside class="panel" id="panel">
    <section class="sec" data-sec="preset" data-for="batch">
      <button class="sec-hd" type="button"><i class="ico chev" data-ic="chev"></i><span class="sec-t"><i class="stn">1</i>選要做什麼</span><span class="sec-en">TASK</span><span class="sec-sum" id="sum-preset"></span></button>
      <div class="sec-bd">
        <div class="presets">
          <button class="preset" data-preset="cutwhite"><span class="pi"><i class="ico" data-ic="wand"></i></span><span class="pt"><b>去背成透明&nbsp;PNG</b><span>JPG&nbsp;去掉背景&nbsp;· 輸出&nbsp;PNG</span></span></button>
          <button class="preset" data-preset="compress"><span class="pi"><i class="ico" data-ic="zip"></i></span><span class="pt"><b>壓縮圖檔</b><span>尺寸不變&nbsp;· 轉&nbsp;JPG&nbsp;· 壓到上限內</span></span></button>
          <button class="preset" data-preset="product"><span class="pi"><i class="ico" data-ic="bag"></i></span><span class="pt"><b>置中補白・調整比例</b><span>放到指定比例＋補上白背景</span></span></button>
          <button class="preset" id="goCollage" type="button"><span class="pi"><i class="ico" data-ic="grid"></i></span><span class="pt"><b>組合圖</b><span>多張圖拼成一張</span></span></button>
          <button class="preset" data-preset="png2jpg"><span class="pi"><i class="ico" data-ic="convert"></i></span><span class="pt"><b>PNG 轉 JPG</b><span>尺寸不變&nbsp;· 透明處填白&nbsp;· 高畫質</span></span></button>
          <button class="preset" data-preset="shrink"><span class="pi"><i class="ico" data-ic="shrink"></i></span><span class="pt"><b>大圖縮小</b><span>長邊&nbsp;1600&nbsp;· 比例不變&nbsp;· 壓到上限內</span></span></button>
        </div>
        <div class="row kbq" id="kbqRow"><span class="unit">每張不超過</span><input type="number" id="kbQuick" min="10" max="20000" step="10" aria-label="每張不超過幾 KB"><span class="unit">KB</span></div>
        <div class="mine closed" id="mine">
          <div class="lbl">我的常用設定</div>
          <div class="presets" id="myList"></div>
          <p class="mine-empty" id="myEmpty">把目前的尺寸、框、Logo、標籤存起來，下次一鍵套用。各品牌、各平台可以各存一組。</p>
          <button class="btn sm full" id="myAdd" type="button"><i class="ico" data-ic="plus"></i>把目前設定存成常用</button>
          <div class="mine-form" id="myForm" hidden>
            <input type="text" id="myName" maxlength="30" placeholder="例如：御熹堂商品圖" aria-label="常用設定名稱">
            <p class="ferr" id="myErr" hidden>請輸入名稱</p>
            <p class="hint" id="myWhat"></p>
            <div class="row"><button class="btn sm dark" id="mySave" type="button">儲存</button><button class="btn sm ghost" id="myCancel" type="button">取消</button></div>
          </div>
          <div class="mine-io">
            <button class="btn sm ghost" id="myExport" type="button" title="把常用設定（含框、Logo）存成一個備份檔"><i class="ico" data-ic="dl"></i>匯出備份</button>
            <button class="btn sm ghost" id="myImport" type="button" title="從備份檔把常用設定加回來"><i class="ico" data-ic="upload"></i>從備份匯入</button>
            <input type="file" id="myImportIn" accept=".json,application/json" hidden>
          </div>
        </div>
      </div>
    </section>

    <button class="adv" id="advBtn" type="button" data-for="batch">進階設定<span class="tg" id="advTg">展開 ▾</span><span>尺寸、框、Logo、標籤、輸出、檔名…上面選好就能用，需要細調再打開</span></button>

    <section class="sec" data-sec="size" data-for="batch">
      <button class="sec-hd" type="button"><i class="ico chev" data-ic="chev"></i><span class="sec-t">尺寸</span><span class="sec-en">SIZE</span><span class="sec-sum" id="sum-size"></span></button>
      <div class="sec-bd">
        <div class="seg" data-k="sizeMode"><button data-v="fixed">固定尺寸</button><button data-v="max">限制長邊</button><button data-v="none">不改尺寸</button></div>
        <div id="fixedBox">
          <div class="row"><input type="number" id="fw" min="16" max="8000" step="2" aria-label="寬度"><span class="unit">×</span><input type="number" id="fh" min="16" max="8000" step="2" aria-label="高度"><span class="unit">px</span></div>
          <div class="chips" id="fixedChips">
            <button class="chip" data-wh="1000,1000">1000×1000</button>
            <button class="chip" data-wh="800,800">800×800</button>
            <button class="chip" data-wh="1200,1200">1200×1200</button>
            <button class="chip" data-wh="1080,1350">1080×1350</button>
            <button class="chip" data-wh="1200,628">1200×628</button>
          </div>
          <div class="lbl">比例不同時</div>
          <div class="seg" data-k="fit"><button data-v="contain">補白置中</button><button data-v="cover">裁切填滿</button></div>
          <div id="containBox">
            <label class="sw mt"><input type="checkbox" id="trim"><span class="sw-ui"></span><span>先去掉原圖白邊，再置中</span></label>
            <div class="row"><span class="unit">四周留白</span><input type="range" id="pad" min="0" max="20" step="1"><span id="padV" class="val">0%</span></div>
          </div>
          <div class="hint">卡片上的移動圖示，可以手動調整每張圖的位置和大小。</div>
        </div>
        <div id="maxBox">
          <div class="row"><span class="unit">最長邊不超過</span><input type="number" id="maxEdge" min="16" max="8000" step="2"><span class="unit">px</span></div>
          <div class="chips" id="maxChips">
            <button class="chip" data-v="800">800</button><button class="chip" data-v="1000">1000</button><button class="chip" data-v="1200">1200</button><button class="chip" data-v="1600">1600</button><button class="chip" data-v="2000">2000</button>
          </div>
          <div class="hint">比這個小的圖不會被放大。</div>
        </div>
      </div>
    </section>

    <section class="sec" data-sec="layout" data-for="collage" hidden>
      <button class="sec-hd" type="button"><i class="ico chev" data-ic="chev"></i><span class="sec-t">版型</span><span class="sec-en">LAYOUT</span><span class="sec-sum" id="sum-layout"></span></button>
      <div class="sec-bd"><div class="layouts" id="layouts"></div></div>
    </section>

    <section class="sec" data-sec="canvas" data-for="collage" hidden>
      <button class="sec-hd" type="button"><i class="ico chev" data-ic="chev"></i><span class="sec-t">畫布</span><span class="sec-en">CANVAS</span><span class="sec-sum" id="sum-canvas"></span></button>
      <div class="sec-bd">
        <div class="row" style="margin-top:0"><input type="number" id="cw" min="100" max="8000" step="2" aria-label="畫布寬度"><span class="unit">×</span><input type="number" id="ch" min="100" max="8000" step="2" aria-label="畫布高度"><span class="unit">px</span></div>
        <div class="chips" id="cChips">
          <button class="chip" data-wh="1000,1000">1000×1000</button>
          <button class="chip" data-wh="1200,1200">1200×1200</button>
          <button class="chip" data-wh="1080,1350">1080×1350</button>
          <button class="chip" data-wh="1200,628">1200×628</button>
        </div>
        <div class="row"><span class="unit">圖片間距</span><input type="range" id="gap" min="0" max="60" step="2"><span id="gapV" class="val">0px</span></div>
        <div class="row"><span class="unit">外框留白</span><input type="range" id="margin" min="0" max="80" step="2"><span id="marginV" class="val">0px</span></div>
        <div class="row"><span class="unit">背景顏色</span><input type="color" id="cbg" aria-label="背景顏色"></div>
        <div class="lbl">圖片放進格子的方式</div>
        <div class="seg" data-k="cfit"><button data-v="cover">裁切填滿</button><button data-v="contain">完整顯示</button></div>
      </div>
    </section>

    <section class="sec" data-sec="cut">
      <button class="sec-hd" type="button"><i class="ico chev" data-ic="chev"></i><span class="sec-t">去背</span><span class="sec-en">REMOVE BG</span><span class="sec-sum" id="sum-cut"></span></button>
      <div class="sec-bd">
        <label class="sw"><input type="checkbox" id="cutOn"><span class="sw-ui"></span><span>自動去掉背景</span></label>
        <div id="cutBox">
          <div class="row"><span class="unit">容許色差</span><input type="range" id="cutTol" min="4" max="80" step="2"><span id="cutTolV" class="val"></span></div>
          <label class="sw mt"><input type="checkbox" id="cutSoft"><span class="sw-ui"></span><span>邊緣柔化（去掉白邊毛邊）</span></label>
          <label class="sw mt"><input type="checkbox" id="cutHoles"><span class="sw-ui"></span><span>被包住的背景也去掉（白色商品別開）</span></label>
          <div class="lbl">商品底下的影子</div>
          <div class="seg" data-k="cutShadow"><button data-v="keep">保留原樣</button><button data-v="soft">變淡影</button><button data-v="remove">去掉</button></div>
          <div class="hint">白底&nbsp;JPG&nbsp;選「保留原樣」。透明&nbsp;PNG&nbsp;要放彩色底時，選<span class="nw">「變淡影」或「去掉」</span>，淺灰色商品要留意會不會被一起變淡。</div>
          <div class="hint">背景沒去乾淨就把色差調大，商品被吃掉就調小。白色商品放白底也可以用。</div>
          <div class="hint">輸出&nbsp;PNG／WebP&nbsp;是透明背景；輸出&nbsp;JPG&nbsp;會填成「透明處填色」，可以把米白底、灰底換成純白底。</div>
        </div>
        <div class="hint" id="cutOffHint">白底、灰底、單色底的商品圖，打開就會自動把背景去掉。</div>
      </div>
    </section>

    <section class="sec" data-sec="extras">
      <button class="sec-hd" type="button"><i class="ico chev" data-ic="chev"></i><span class="sec-t">加工</span><span class="sec-en">EXTRAS</span><span class="sec-sum" id="sum-extras"></span></button>
      <div class="sec-bd">
        <div class="xcard" id="frameCard">
          <label class="sw xhd"><input type="checkbox" id="frameOn"><span class="sw-ui"></span><span class="xt">套商品框</span><i class="ico" data-ic="frame"></i></label>
          <div class="xbd" id="frameBox">
            <div class="row"><button class="btn sm" id="frameUp">上傳框（PNG）</button><img class="asset" id="frameThumb" src="" alt=""></div>
            <div class="hint">框會拉滿整張圖、疊在最上層。框的尺寸最好跟輸出尺寸一樣，中間要挖空透明。</div>
          </div>
        </div>
        <div class="xcard" id="logoCard">
          <label class="sw xhd"><input type="checkbox" id="logoOn"><span class="sw-ui"></span><span class="xt">加 Logo／浮水印</span><i class="ico" data-ic="award"></i></label>
          <div class="xbd" id="logoBox">
            <div class="row"><button class="btn sm" id="logoUp">上傳 Logo</button><img class="asset" id="logoThumb" src="" alt=""></div>
            <div class="lbl">位置</div><div class="pos" data-k="logoPos"></div>
            <div class="row"><span class="unit">大小</span><input type="range" id="logoSize" min="4" max="60" step="1"><span id="logoSizeV" class="val"></span></div>
            <div class="row"><span class="unit">不透明度</span><input type="range" id="logoOp" min="10" max="100" step="5"><span id="logoOpV" class="val"></span></div>
            <div class="row"><span class="unit">離邊距離</span><input type="range" id="logoMargin" min="0" max="16" step="1"><span id="logoMarginV" class="val"></span></div>
          </div>
        </div>
        <div class="xcard" id="labelCard">
          <label class="sw xhd"><input type="checkbox" id="labelOn"><span class="sw-ui"></span><span class="xt">加文字標籤</span><i class="ico" data-ic="tag"></i></label>
          <div class="xbd" id="labelBox">
            <div class="row"><textarea id="labelText" rows="1" placeholder="輸入文字，按 Enter 可換行"></textarea></div>
            <div class="chips" id="labelChips">
              <button class="chip">買一送一</button><button class="chip">限時特價</button><button class="chip">新品上市</button><button class="chip">熱銷</button><button class="chip">組合價</button>
            </div>
            <div class="lbl">位置</div><div class="pos" data-k="labelPos"></div>
            <div class="lbl">樣式</div>
            <div class="seg" data-k="labelShape"><button data-v="pill">圓角</button><button data-v="rect">方角</button><button data-v="circle">圓形</button></div>
            <div class="row"><span class="unit">底色</span><input type="color" id="labelBg" aria-label="標籤底色"><span class="unit">字色</span><input type="color" id="labelColor" aria-label="標籤字色"></div>
            <div class="row"><span class="unit">字級</span><input type="range" id="labelSize" min="3" max="20" step="1"><span id="labelSizeV" class="val"></span></div>
            <div class="row"><span class="unit">離邊距離</span><input type="range" id="labelMargin" min="0" max="16" step="1"><span id="labelMarginV" class="val"></span></div>
          </div>
        </div>
        <input type="file" id="assetIn" accept="image/png,image/webp,image/jpeg" hidden>
      </div>
    </section>

    <section class="sec" data-sec="output">
      <button class="sec-hd" type="button"><i class="ico chev" data-ic="chev"></i><span class="sec-t">輸出</span><span class="sec-en">OUTPUT</span><span class="sec-sum" id="sum-output"></span></button>
      <div class="sec-bd">
        <div class="lbl" style="margin-top:0">格式</div>
        <div class="seg" data-k="fmt"><button data-v="jpeg">JPG</button><button data-v="png">PNG</button><button data-v="webp">WebP</button><button data-v="keep">原格式</button></div>
        <div class="row" id="bgRow"><span class="unit">透明處填色</span><input type="color" id="bg" aria-label="透明處填色"><span class="unit">JPG 不支援透明</span></div>
        <label class="sw mt" id="alphaRow"><input type="checkbox" id="alpha"><span class="sw-ui"></span><span>PNG／WebP 保留透明背景</span></label>
        <div class="lbl">壓縮方式</div>
        <div class="seg" data-k="mode"><button data-v="limit">指定大小上限</button><button data-v="quality">指定品質</button></div>
        <div id="limitBox">
          <div class="row"><span class="unit">每張不超過</span><input type="number" id="kb" min="10" max="20000" step="10"><span class="unit">KB</span></div>
          <div class="chips" id="kbChips">
            <button class="chip" data-v="200">200KB</button><button class="chip" data-v="300">300KB</button><button class="chip" data-v="450">450KB</button><button class="chip" data-v="1000">1MB</button><button class="chip" data-v="2000">2MB</button>
          </div>
          <div class="hint">會自動找出符合大小的最高畫質。</div>
        </div>
        <div id="qualityBox">
          <div class="row"><input type="range" id="q" min="10" max="100" step="1"><span id="qV" class="val">80</span></div>
          <div class="hint">建議 75–90，數字越小檔案越小、畫質越差。</div>
        </div>
      </div>
    </section>

    <section class="sec" data-sec="naming" data-for="batch">
      <button class="sec-hd" type="button"><i class="ico chev" data-ic="chev"></i><span class="sec-t">檔名</span><span class="sec-en">NAME</span><span class="sec-sum" id="sum-naming"></span></button>
      <div class="sec-bd">
        <div class="seg" data-k="naming"><button data-v="keep">維持原名</button><button data-v="suffix">加後綴</button><button data-v="seq">流水號</button></div>
        <div class="row" id="suffixRow"><span class="unit">原名＋</span><input type="text" id="suffix" aria-label="後綴"></div>
        <div id="seqRow">
          <div class="row"><span class="unit">前綴</span><input type="text" id="prefix" aria-label="前綴"></div>
          <div class="row"><span class="unit">從</span><input type="number" id="seqStart" min="0" max="99999" aria-label="起始編號"><span class="unit">開始編號</span></div>
          <div class="hint">依卡片順序編號，可以直接拖曳卡片調整順序。</div>
        </div>
        <div class="hint" id="nameEx"></div>
      </div>
    </section>
  </aside>

  <section class="work" id="wBatch">
    <div class="plan" id="plan"></div>
    <div class="stp"><i class="stn">2</i>放入圖片</div>
    <div class="drop" id="drop" role="button" tabindex="0">
      <div class="ic"><i class="ico" data-ic="upload"></i></div>
      <div class="dt">
        <b>把圖片拖到這裡</b>
        <p class="p-full">或點一下選擇檔案，可以一次選多張、拖整個資料夾，也能 Ctrl+V 貼上</p>
        <p class="p-compact">或點一下加入更多，也能 Ctrl+V 貼上</p>
        <p class="fmt">支援 JPG・PNG・WebP・GIF・BMP</p>
      </div>
      <span class="btn">選擇檔案</span>
    </div>
    <input type="file" id="file" accept="image/*" multiple hidden>

    <div class="feats" id="feats" hidden></div>

    <div class="stp" id="stp3" hidden><i class="stn">3</i>確認成品，再下載</div>
    <div class="bar" id="bar" hidden>
      <div class="stats">
        <div class="stat"><span class="stat-l">圖片</span><span class="stat-n" id="stCount">0</span></div>
        <div class="stat"><span class="stat-l">檔案大小</span><span class="stat-n" id="stSize">—</span></div>
        <div class="stat"><span class="stat-l" id="stSaveL">共省下</span><span class="stat-n" id="stSave">—</span></div>
        <div class="stat" id="stOverWrap" hidden><span class="stat-l">超過大小</span><span class="stat-n warn" id="stOver">0</span></div>
        <div class="stat" id="stErrWrap" hidden><span class="stat-l">無法讀取</span><span class="stat-n warn" id="stErr">0</span></div>
      </div>
      <div class="acts">
        <span class="busy" id="busy" hidden><span class="spin"></span><span id="busyT">處理中</span></span>
        <button class="btn ghost" id="clearBtn">清空</button>
        <button class="btn" id="pdfBtn" title="把這些圖片合併成一份 PDF"><i class="ico" data-ic="zip"></i>轉成 PDF</button>
        <button class="btn" id="dirBtn" title="直接存進電腦裡的資料夾，不用解壓縮（同名檔案不會被覆蓋）" hidden><i class="ico" data-ic="folder"></i>存到資料夾</button>
        <button class="btn pri" id="zipBtn"><i class="ico" data-ic="dl"></i><span id="zipT">打包下載</span></button>
      </div>
      <div class="prog" id="prog" hidden><i id="progBar"></i></div>
    </div>

    <div class="pdfbox" id="pdfBox" hidden>
      <div class="stp">圖片轉 PDF<span class="pdfsub">照目前排列順序合併成一份，可拖卡片調順序</span></div>

/* ---------- 設定 ---------- */
const DEF={sizeMode:'none',fw:1000,fh:1000,fit:'contain',trim:false,pad:0,maxEdge:1600,
  fmt:'jpeg',bg:'#ffffff',alpha:true,mode:'limit',kb:450,q:85,

  cutOn:false,cutTol:30,cutSoft:true,cutHoles:false,cutShadow:'keep',
  labelOn:false,labelText:'買一送一',labelPos:'tl',labelShape:'pill',labelBg:'#E0820A',labelColor:'#ffffff',labelSize:7,labelMargin:3,
  open:{preset:true,size:false,layout:true,canvas:true,cut:false,extras:false,output:false,naming:false}};

try{Object.assign(S,JSON.parse(localStorage.getItem('imgtool.settings')||'{}'))}catch(e){}
